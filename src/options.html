<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Don't Scroll settings</title>
    <style>
      body { max-width: 560px; margin: 48px auto; padding: 0 20px; color: #28251f; font: 16px system-ui, sans-serif; }
      label { display: block; margin: 24px 0 8px; font-weight: 700; }
      select, input, button { padding: 8px; font: inherit; }
      input { width: 90px; }
      #saved { min-height: 24px; color: #3d6b67; }
    </style>
  </head>
  <body>
    <h1>Don't Scroll settings</h1>
    <label for="difficulty">Sudoku difficulty</label>
    <select id="difficulty">
      <option value="braindead">Braindead (2 numbers)</option>
      <option value="easy">Easy (9 numbers)</option>
      <option value="medium">Medium (20 numbers)</option>
      <option value="hard">Hard (35 numbers)</option>
      <option value="evil">Evil (50 numbers)</option>
    </select>
    <label for="jumps">Maximum link jumps</label>
    <input id="jumps" type="number" min="0" max="19" step="1">
    <p>Each visit uses a random number of jumps from 0 through this value.</p>
    <label for="unlock-minutes">Scrolling time after solving (minutes)</label>
    <input id="unlock-minutes" type="number" min="1" max="240" step="1">
    <p>When this expires, all blocked tabs require a new Sudoku solution.</p>
    <button id="save">Save settings</button>
    <details>
      <summary>Developer settings</summary>
      <p id="time-left">Loading session status...</p>
      <button id="reset-session">Require Sudoku now</button>
    </details>
    <p id="saved" aria-live="polite"></p>
    <script src="options.js"></script>
  </body>
</html>
